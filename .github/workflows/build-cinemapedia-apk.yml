name: Build Cinemapedia APK

on:
  workflow_dispatch:
  push:
    branches:
      - DMI-Practica06
      - main
    paths:
      - '.github/workflows/build-cinemapedia-apk.yml'
      - 'Practica 6/cinemapedia/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Cinemapedia Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Create .env file with API Key
        working-directory: "Practica 6/cinemapedia"
        run: |
          if [ -n "${{ secrets.THE_MOVIEDB_KEY }}" ]; then
            echo "THE_MOVIEDB_KEY=${{ secrets.THE_MOVIEDB_KEY }}" > .env
          else
            echo "THE_MOVIEDB_KEY=b2c554c00057161b9a11707ef0cb115e" > .env
          fi

      - name: Get Dependencies
        working-directory: "Practica 6/cinemapedia"
        run: flutter pub get

      - name: Patch plugins for AGP compatibility
        run: |
          ISAR_GRADLE=$(find ~/.pub-cache -path "*isar_flutter_libs*/android/build.gradle" | head -n 1)
          if [ -n "$ISAR_GRADLE" ]; then
            echo "Patching isar_flutter_libs: $ISAR_GRADLE"
            # Idempotente: eliminar namespace previo (pub-cache puede venir cacheado ya parcheado)
            sed -i "/namespace 'dev.isar.isar_flutter_libs'/d" "$ISAR_GRADLE"
            sed -i "0,/android {/s//android {\n    namespace 'dev.isar.isar_flutter_libs'/" "$ISAR_GRADLE"
            # Isar 3.1.0 compila contra SDK 30; sus dependencias AndroidX exigen 33+. Subir a 36.
            sed -i -E "s/compileSdk(Version)? ?[0-9]+/compileSdk 36/g" "$ISAR_GRADLE"
          else
            echo "WARNING: isar_flutter_libs build.gradle no encontrado"
          fi
          # Red de seguridad: subir compileSdk obsoleto (<33) en cualquier plugin de pub-cache
          find ~/.pub-cache -type f -name "build.gradle" -exec sed -i -E "s/compileSdk(Version)? ?[0-9]+/compileSdk 36/g" {} + || true
          find ~/.pub-cache -type f -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

      - name: Build APK Release
        working-directory: "Practica 6/cinemapedia"
        run: |
          flutter build apk --release --android-skip-build-dependency-validation > build_release.log 2>&1 || {
            echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_release.log
            exit 1
          }

      - name: Push Build Log to Repo on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "Practica 6/cinemapedia/build_release.log" ./BUILD_FAILURE.txt || true
          git add BUILD_FAILURE.txt
          git commit -m "ci: log de error de compilacion para diagnostico" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: 'Practica 6/cinemapedia/build_release.log'

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cinemapedia-230040-release-apk
          path: 'Practica 6/cinemapedia/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DMI-Practica06'
        with:
          tag_name: cinemapedia-v1.0.0
          name: "Cinemapedia 230040 - Release APK"
          body: "APK Release de Cinemapedia 230040 (Práctica 6 - DMI). Incluye SplashScreen, Menú lateral deslizable, Carrusel con autoplay y overlay, Masonry Grid, Reproductor de tráilers de YouTube, Persistencia Isar DB e Internacionalización en 5 idiomas (ES/EN/DE/ZH/AR)."
          files: 'Practica 6/cinemapedia/build/app/outputs/flutter-apk/app-release.apk'
