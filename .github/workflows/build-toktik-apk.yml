name: Build TokTik APK

on:
  workflow_dispatch:
  push:
    branches:
      - DMI-Practica04
      - main
    paths:
      - '.github/workflows/build-toktik-apk.yml'
      - 'Practica 4/TokTik/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Get Dependencies
        working-directory: Practica 4/TokTik
        run: flutter pub get

      - name: Build APK Release
        working-directory: Practica 4/TokTik
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TokTik-release-apk
          path: 'Practica 4/TokTik/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/DMI-Practica04'
        with:
          tag_name: v1.0.0-apk
          name: "TokTik v1.0.0 Release APK"
          body: "Descarga directa de APK de TokTik para Appetize.io y pruebas."
          files: 'Practica 4/TokTik/build/app/outputs/flutter-apk/app-release.apk'
