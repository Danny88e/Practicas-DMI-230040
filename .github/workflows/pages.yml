name: Publish architecture diagram

on:
  push:
    branches:
      - main
      - DMI-Practica05
    paths:
      - '.github/workflows/pages.yml'
      - 'Practica 2/hello_world_app_230040/architecture-diagram.html'
      - 'Practica 4/TokTik/architecture-diagram.html'
      - 'Practica 5/widgets_app/architecture-diagram.html'
      - 'Practica 5/widgets_app/architecture_diagram.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Diagram Site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare diagram site
        run: |
          mkdir -p 'site/Practica 2/hello_world_app_230040'
          cp 'Practica 2/hello_world_app_230040/architecture-diagram.html' 'site/Practica 2/hello_world_app_230040/' 2>/dev/null || true
          mkdir -p 'site/Practica 4/TokTik'
          cp 'Practica 4/TokTik/architecture-diagram.html' 'site/Practica 4/TokTik/' 2>/dev/null || true
          mkdir -p 'site/Practica 5/widgets_app'
          cp 'Practica 5/widgets_app/architecture-diagram.html' 'site/Practica 5/widgets_app/' 2>/dev/null || true
          cp 'Practica 5/widgets_app/architecture_diagram.html' 'site/Practica 5/widgets_app/' 2>/dev/null || true
          mkdir -p 'site/Practica-05/widgets_app'
          cp 'Practica 5/widgets_app/architecture-diagram.html' 'site/Practica-05/widgets_app/' 2>/dev/null || true
          cp 'Practica 5/widgets_app/architecture_diagram.html' 'site/Practica-05/widgets_app/' 2>/dev/null || true
          cp 'Practica 5/widgets_app/architecture-diagram.html' 'site/index.html' 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
