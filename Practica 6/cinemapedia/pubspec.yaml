name: cinemapedia
description: "Cinemapedia 230040 - Práctica 6 DMI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.8
  animate_do: ^3.3.4
  card_swiper: ^3.0.1
  flutter_staggered_grid_view: ^0.7.0

  # Network
  dio: ^5.8.0

  # Navigation
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4

  # Video
  youtube_player_flutter: ^9.1.1

  # Utils
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - .env
